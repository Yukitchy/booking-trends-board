<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案6 クイック投稿型｜ナスとトマト共同編集</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; background:#f4f4f4; color:#222; -webkit-font-smoothing:antialiased; }
  header { background:#fff; border-bottom:1px solid #e6e6e6; position:sticky; top:0; z-index:10; }
  .head-in { max-width:760px; margin:0 auto; padding:12px 16px; }
  .title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:19px; font-weight:800; white-space:nowrap; }
  h1 .accent { color:#e2492f; }
  .back { font-size:13px; color:#666; text-decoration:none; white-space:nowrap; }
  .progress { margin-top:10px; }
  .progress-meta { display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:#444; margin-bottom:5px; }
  .bar { height:8px; background:#eee; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#e2492f; border-radius:99px; transition:width .3s; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 110px; }
  .hint { font-size:13px; color:#666; line-height:1.6; margin-bottom:14px; }
  .idea { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); padding:12px; display:flex; gap:12px; margin-bottom:12px; }
  .idea.new { border:2px solid #e2492f; }
  .thumb { width:76px; height:76px; flex:none; background:#faf7f2; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:6px; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb.txt { font-size:26px; font-weight:800; color:#bbb; }
  .ibody { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .serifu { font-size:16px; font-weight:800; line-height:1.35; }
  .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .who { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
  .who.nasu { background:#ece7f7; color:#5b4a8a; }
  .who.tomato { background:#fdeae7; color:#c23a24; }
  .who.both { background:#e8f2e9; color:#2e7d46; }
  .time { font-size:11px; color:#999; }
  .status { font-size:11px; font-weight:800; padding:2px 8px; border-radius:99px; margin-left:auto; }
  .status.done { background:#e2f4ea; color:#178a50; }
  .status.wait { background:#fdf3e0; color:#a86f08; }
  .status.none { background:#eee; color:#777; }
  .checks { display:flex; gap:6px; }
  .chk { flex:1; border:1.5px solid #ddd; background:#fff; border-radius:9px; padding:6px 2px; font-size:12px; font-weight:700; color:#999; cursor:pointer; }
  .chk small { display:block; font-size:10px; font-weight:600; }
  .chk.y-on { border-color:#5b4a8a; background:#5b4a8a; color:#fff; }
  .chk.r-on { border-color:#e2492f; background:#e2492f; color:#fff; }
  .cmt { font-size:11.5px; color:#888; }
  .postbar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e2e2e2; box-shadow:0 -2px 10px rgba(0,0,0,.06); z-index:20; }
  .postbar-in { max-width:760px; margin:0 auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; }
  .charbtn { flex:none; border:1.5px solid #ddd; background:#faf7f2; border-radius:999px; padding:9px 12px; font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .charbtn.nasu { border-color:#5b4a8a; color:#5b4a8a; }
  .charbtn.tomato { border-color:#e2492f; color:#e2492f; }
  .charbtn.both { border-color:#2e7d46; color:#2e7d46; }
  .postbar input { flex:1; min-width:0; border:1.5px solid #ddd; border-radius:999px; padding:10px 14px; font-size:15px; outline:none; }
  .postbar input:focus { border-color:#e2492f; }
  .send { flex:none; border:none; background:#e2492f; color:#fff; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="title-row">
      <h1><span class="accent">ナスとトマト</span> 共同編集</h1>
      <a class="back" href="index.html">← 案一覧</a>
    </div>
    <div class="progress">
      <div class="progress-meta"><span>確定 <b id="doneCount">12</b> / 40</span><span id="pct">30%</span></div>
      <div class="bar"><i id="barFill" style="width:30%"></i></div>
    </div>
  </div>
</header>
<main>
  <p class="hint">思いついたら、下のバーからそのまま投稿。キャラはボタンを押すたびに切り替わります。</p>
  <div id="feed"></div>
</main>
<div class="postbar">
  <div class="postbar-in">
    <button class="charbtn tomato" id="charBtn">トマト</button>
    <input id="inp" type="text" placeholder="新しいネタのセリフを入力">
    <button class="send" id="sendBtn">投稿</button>
  </div>
</div>
<script>
  const BASE_DONE_OTHERS = 7;
  const items = [
    { n:"09", s:"ありがとねぃ", who:"tomato", y:1, r:1, c:3, t:"昨日" },
    { n:"16", s:"やばばば", who:"nasu", y:1, r:0, c:1, t:"昨日" },
    { n:"33", s:"ごめん今電車", who:"tomato", y:0, r:0, c:0, t:"一昨日" },
    { n:"04", s:"ぎょいです", who:"nasu", y:1, r:1, c:0, t:"3日前" },
    { n:"27", s:"ねむむい", who:"tomato", y:0, r:1, c:2, t:"3日前" },
    { n:"40", s:"おつぽんとまと", who:"tomato", y:1, r:1, c:1, t:"4日前" }
  ];
  const whoLabel = { nasu:"ナス", tomato:"トマト", both:"2人" };
  const feed = document.getElementById("feed");
  function statusOf(it){ if(it.y&&it.r) return ["done","確定"]; if(it.y||it.r) return ["wait","確認待ち"]; return ["none","未確認"]; }
  function render(){
    feed.innerHTML = "";
    items.forEach((it, i) => {
      const [cls, label] = statusOf(it);
      const el = document.createElement("div");
      el.className = "idea" + (it.fresh ? " new" : "");
      el.innerHTML =
        (it.n ? '<div class="thumb"><img src="img/' + it.n + '.png" alt=""></div>' : '<div class="thumb txt">？</div>') +
        '<div class="ibody">' +
          '<div class="serifu">' + it.s + '</div>' +
          '<div class="row"><span class="who ' + it.who + '">' + whoLabel[it.who] + '</span><span class="time">' + it.t + '</span>' +
          '<span class="status ' + cls + '">' + label + '</span></div>' +
          '<div class="checks">' +
            '<button class="chk' + (it.y ? " y-on" : "") + '" data-i="' + i + '" data-k="y">ゆうき<small>' + (it.y ? "確認済み" : "未確認") + '</small></button>' +
            '<button class="chk' + (it.r ? " r-on" : "") + '" data-i="' + i + '" data-k="r">ゆりっぺ<small>' + (it.r ? "確認済み" : "未確認") + '</small></button>' +
          '</div>' +
          '<div class="cmt">' + (it.c ? "コメント " + it.c + "件" : "コメントなし") + '</div>' +
        '</div>';
      feed.appendChild(el);
    });
    const total = BASE_DONE_OTHERS + items.filter(it => it.y && it.r).length;
    document.getElementById("doneCount").textContent = total;
    document.getElementById("pct").textContent = Math.round(total / 40 * 100) + "%";
    document.getElementById("barFill").style.width = (total / 40 * 100) + "%";
    feed.querySelectorAll(".chk").forEach(b => b.addEventListener("click", () => {
      const it = items[+b.dataset.i];
      it[b.dataset.k] = it[b.dataset.k] ? 0 : 1;
      render();
    }));
  }
  const chars = ["tomato", "nasu", "both"];
  let ci = 0;
  const charBtn = document.getElementById("charBtn");
  charBtn.addEventListener("click", () => {
    ci = (ci + 1) % chars.length;
    charBtn.className = "charbtn " + chars[ci];
    charBtn.textContent = whoLabel[chars[ci]];
  });
  function post(){
    const v = document.getElementById("inp").value.trim();
    if (!v) return;
    items.forEach(it => delete it.fresh);
    items.unshift({ n:"", s:v, who:chars[ci], y:0, r:0, c:0, t:"たった今", fresh:1 });
    document.getElementById("inp").value = "";
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
  }
  document.getElementById("sendBtn").addEventListener("click", post);
  document.getElementById("inp").addEventListener("keydown", e => { if (e.key === "Enter") post(); });
  render();
</script>
</body>
</html>
