<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0a0a0a; color:#fff; overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  .pad { padding:44px 52px; }
  .kicker { font-size:15px; letter-spacing:.24em; font-weight:700; color:#ff4655; }
  h1 { font-size:47px; font-weight:900; line-height:1.3; margin-top:10px; }
  .rule { width:120px; height:7px; background:#c8102e; margin:18px 0 24px; }
  .shots { display:flex; gap:14px; }
  .shots figure { flex:1; }
  .shots img { width:100%; height:308px; object-fit:cover; object-position:top; border-radius:10px; display:block; background:#222; }
  .shots figcaption { font-size:14.5px; font-weight:900; text-align:center; margin-top:9px; }
</style>
</head>
<body>
<div class="pad">
  <div class="kicker">REEL COCKPIT — LIVE PROTOTYPES</div>
  <h1>リール自動編集コックピット 触れるプロトタイプ5案</h1>
  <div class="rule"></div>
  <div class="shots">
    <figure><img src="shot1.jpg" alt=""><figcaption>1 CapCut風</figcaption></figure>
    <figure><img src="shot2.jpg" alt=""><figcaption>2 Canva風</figcaption></figure>
    <figure><img src="shot3.jpg" alt=""><figcaption>3 プロ編集風</figcaption></figure>
    <figure><img src="shot4.jpg" alt=""><figcaption>4 InShot／VN風</figcaption></figure>
    <figure><img src="shot5.jpg" alt=""><figcaption>5 YouTube Create風</figcaption></figure>
  </div>
</div>
</body>
</html>
