<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ストーリー情報セル デザイン5案</title>
<meta property="og:title" content="ストーリー情報セル デザイン5案">
<meta property="og:description" content="だんどりー ストーリーの情報セル（中左・黒）のフォントと枠まわりを変えた5案。現行との見比べ。">
<meta property="og:image" content="https://yukitchy.github.io/booking-trends-board/dandori-story-infocell/og.jpg">
<meta property="og:url" content="https://yukitchy.github.io/booking-trends-board/dandori-story-infocell/">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f2ed; color: #191919;
         font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  header { padding: 28px 18px 6px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: .02em; }
  header p { font-size: 13.5px; line-height: 1.7; color: #55534e; margin: 0 0 6px; }
  main { max-width: 480px; margin: 0 auto; padding: 10px 14px 48px; }
  section { margin: 26px 0 34px; }
  .tag { display: flex; align-items: baseline; gap: 9px; margin: 0 4px 10px; }
  .num { background: #151515; color: #fff; font-weight: 700; font-size: 14px;
         padding: 3px 10px; border-radius: 999px; letter-spacing: .04em; white-space: nowrap; }
  .num.now { background: #8a867e; }
  .name { font-size: 17px; font-weight: 700; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; max-width: 390px; margin: 0 auto;
               border-radius: 10px; box-shadow: 0 4px 18px rgba(20,20,20,.18); }
  figcaption { max-width: 390px; margin: 10px auto 0; font-size: 13px;
               line-height: 1.75; color: #55534e; padding: 0 2px; }
  figcaption b { color: #191919; }
</style>
</head>
<body>
<header>
  <h1>ストーリー情報セル デザイン5案</h1>
  <p>中身は全案共通（AKIHABARA ANIME TOUR／w/ @stilljftb／赤線／まとめ本文、Jennifer の実写真）。変えたのは情報セル（中左・黒）の<strong>フォントと枠まわり</strong>だけ。番号で選んでください。</p>
</header>
<main>

  <section>
    <div class="tag"><span class="num now">現行</span><span class="name">いまの確定形</span></div>
    <figure>
      <img src="current.jpg" alt="現行の情報セル">
      <figcaption>サンセリフの見出し＋明朝系の本文。枠なしの黒ベタに、短い赤線。</figcaption>
    </figure>
  </section>

  <section>
    <div class="tag"><span class="num">1</span><span class="name">エディトリアル誌面</span></div>
    <figure>
      <img src="v1_editorial.jpg" alt="案1 エディトリアル誌面">
      <figcaption><b>Playfair Display</b> の見出し＋ <b>EB Garamond</b> の本文。二重罫のプレート枠で雑誌の表紙みたいに組む。赤線は短い太線＋細罫の組み合わせ。</figcaption>
    </figure>
  </section>

  <section>
    <div class="tag"><span class="num">2</span><span class="name">スイス・グリッド</span></div>
    <figure>
      <img src="v2_swiss.jpg" alt="案2 スイス・グリッド">
      <figcaption><b>Archivo</b> を強い字間で組むスイス式。枠はなく、赤ブロックと横罫線だけで仕切る。w/ だけ赤。</figcaption>
    </figure>
  </section>

  <section>
    <div class="tag"><span class="num">3</span><span class="name">タイプライター</span></div>
    <figure>
      <img src="v3_typewriter.jpg" alt="案3 タイプライター">
      <figcaption>全部 <b>Space Mono</b>。点線の枠＋赤いマージン縦線＋罫紙の地で、タイプ打ちの書類みたいな質感。赤線は破線。</figcaption>
    </figure>
  </section>

  <section>
    <div class="tag"><span class="num">4</span><span class="name">和風ミニマル</span></div>
    <figure>
      <img src="v4_mincho.jpg" alt="案4 和風ミニマル">
      <figcaption><b>しっぽり明朝</b> に広い字間と行間。枠の代わりに左の縦罫1本と、朱の小四角だけ。いちばん静かな組み。</figcaption>
    </figure>
  </section>

  <section>
    <div class="tag"><span class="num">5</span><span class="name">大胆タイポ</span></div>
    <figure>
      <img src="v5_boldtype.jpg" alt="案5 大胆タイポ">
      <figcaption><b>Anton</b> の特大タイトルを3段に積み、TOUR は赤。赤線は全幅の太バー。本文は極小のグレーで引き算。</figcaption>
    </figure>
  </section>

</main>
</body>
</html>
