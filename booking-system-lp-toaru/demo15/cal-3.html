<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カレンダー中心型 案3 フローティングドック型 | 予約管理デモ（スマホ版）</title>
<meta property="og:title" content="カレンダー中心型 案3 フローティングドック型 | 予約管理デモ（スマホ版）">
<meta property="og:description" content="カレンダー中心型デモのスマホ版・フローティングドック型。今日・警告の日へのジャンプをドックに集約します。">
<meta property="og:image" content="https://yukitchy.github.io/booking-trends-board/booking-system-lp-toaru/og.jpg">
<meta property="og:url" content="https://yukitchy.github.io/booking-trends-board/booking-system-lp-toaru/demo15/cal-3.html">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{--paper:#f1efea;--ink:#151515}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7}
.wrap{max-width:480px;margin:0 auto;padding:14px 12px 132px}
.note{font-size:12.5px;font-weight:700;color:#5a5245;text-align:center;margin-bottom:12px;line-height:1.75}
.note b{color:#e03c31}
.hd{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.hd .logo{font-weight:800;font-size:18px;white-space:nowrap}
.hd .logo span{color:#ff6b5e}
.hd .sub{font-size:11.5px;opacity:.75;margin-top:2px;line-height:1.6}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px;font-weight:700;margin:0 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.c-viator{background:#7a1f3d}.c-byfood{background:#e4572e}.c-own{background:#1d7a5f}.c-airbnb{background:#ff5a5f}
.cal{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px}
.cal h2{font-size:17px;font-weight:800;margin-bottom:10px;line-height:1.5}
.cal h2 small{display:block;font-size:11px;color:#777;font-weight:500;margin-top:2px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:11.5px;font-weight:700;color:#666;padding:3px 0}
.dow div.sun{color:#d33}.dow div.sat{color:#36c}
.cell{min-height:57px;border:1.5px solid #ddd;border-radius:9px;padding:4px;font-size:11px;background:#fff;cursor:pointer;position:relative;min-width:0;overflow:hidden}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell.today{border-color:var(--ink);border-width:2.5px}
.cell.sel{outline:3px solid #ffd34d;outline-offset:-1px}
.cell .d{font-weight:800;font-size:12px}
.cell.sun .d{color:#d33}.cell.sat .d{color:#36c}
.cell.overlap{background:#fff1f0;border-color:#e03c31;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,60,49,0)}50%{box-shadow:0 0 0 5px rgba(224,60,49,.18)}}
.chip{display:block;color:#fff;border-radius:5px;padding:2px 4px;margin-top:3px;font-size:9.5px;font-weight:700;line-height:1.3;white-space:normal;overflow:hidden}
.warnmark{position:absolute;top:3px;right:4px;font-size:11px}
.panel{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;margin-top:12px}
.panel.first{margin-top:0}
.panel h3{font-size:16px;font-weight:800;margin-bottom:4px;line-height:1.5}
.panel .none{font-size:13px;color:#777;line-height:1.8}
.res{border-top:1.5px dashed #ccc;padding:10px 0;font-size:13.5px;line-height:1.75}
.res:first-of-type{border-top:none}
.res .t{font-weight:800;font-size:14.5px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;line-height:1.4;color:#fff;margin-left:6px;white-space:nowrap}
.warn{background:#fff1f0;border:1.5px solid #e03c31;color:#a02015;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px;line-height:1.65}
footer{margin:12px auto 0;font-size:11.5px;color:#8a929c;text-align:center;line-height:1.7}
.view{display:none}.view.on{display:block}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:50}
.tabbar{background:#fff;border-top:2.5px solid var(--ink);display:flex}
.tabbar button{flex:1;background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:800;color:#a39e93;padding:8px 0 12px;cursor:pointer;position:relative;line-height:1.4}
.tabbar button .ic{display:block;font-size:19px;line-height:1.3}
.tabbar button.on{color:var(--ink)}
.tabbar .cnt{position:absolute;top:6px;right:calc(50% - 18px);background:#e03c31;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;line-height:1.5}
.actionbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.actionbar.warn{box-shadow:inset 0 3px 0 #e03c31}
.ab-txt{flex:1;min-width:0}
.ab-cap{display:block;font-size:10.5px;font-weight:800;color:#ffd34d;letter-spacing:.08em}
.ab-next{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:700;line-height:1.5}
.ab-btn{flex:none;background:#ffd34d;color:var(--ink);border:none;font-family:inherit;font-size:13.5px;font-weight:800;border-radius:999px;padding:12px 18px;cursor:pointer;min-height:44px}
.dockwrap{padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.dockin{pointer-events:auto;background:#fff;border:2px solid var(--ink);border-radius:999px;box-shadow:0 10px 24px rgba(21,21,21,.25);display:flex;padding:6px}
.dockin button{flex:1;background:none;border:none;font-family:inherit;font-size:10.5px;font-weight:800;color:#5a5245;padding:7px 0 8px;cursor:pointer;line-height:1.35;border-radius:999px}
.dockin button .ic{display:block;font-size:17px;line-height:1.25}
.dockin button:active{background:var(--paper)}
.sumbar{background:var(--ink);color:#fff;border:none;width:100%;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 16px calc(12px + env(safe-area-inset-bottom));cursor:pointer}
.sumbar .sb-main{flex:1;min-width:0}
.sumbar .sb-name{display:block;font-size:14.5px;font-weight:800;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbar .sb-meta{display:block;font-size:11.5px;color:#cfd4da;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbar .sb-open{flex:none;background:#ffd34d;color:var(--ink);font-size:12.5px;font-weight:800;border-radius:999px;padding:9px 14px;line-height:1.4}
.overlay{position:fixed;inset:0;background:rgba(21,21,21,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,106%);width:min(480px,100%);max-height:84vh;overflow-y:auto;background:#fff;border:2.5px solid var(--ink);border-bottom:none;border-radius:20px 20px 0 0;z-index:61;transition:transform .32s ease;padding:8px 16px 26px}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:#ddd;margin:4px auto 8px}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-hd .t{font-size:13px;font-weight:800;color:#999;letter-spacing:.08em}
.sheet-hd button{background:var(--paper);border:2px solid #e3e0d9;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink);flex:none}
.sheet .panel{border:none;padding:4px 0 0;margin-top:0}
.stepbar{background:#fff;border-top:2.5px solid var(--ink);display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.stepbar .nav{flex:none;background:var(--ink);color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:800;border-radius:999px;padding:11px 13px;cursor:pointer;min-height:44px}
.stepbar .nav:disabled{background:#ddd;color:#a39e93;cursor:default}
.step-mid{flex:1;text-align:center;min-width:0}
.step-count{font-size:13px;font-weight:800;line-height:1.4;white-space:nowrap}
.step-date{font-size:11px;color:#8a929c;font-weight:700;line-height:1.4;white-space:nowrap}

</style>
</head>
<body>

<div class="wrap" style="padding-bottom:150px">
<p class="note">実物デモ カレンダー中心型 案3 ― <b>フローティングドック型</b>：下の浮いたドックから、今日・警告の日へ飛べます</p>
<div class="hd"><div class="logo">予約カレンダー <span>TOARU</span></div><div class="sub">カレンダーと照合して、重なりを先に見つける</div></div>
<div class="legend"><span><span class="dot c-viator"></span>Viator</span><span><span class="dot c-byfood"></span>byFood</span><span><span class="dot c-own"></span>自社サイト</span><span><span class="dot c-airbnb"></span>Airbnb</span><span>⚠️ = 時間が重なっている日</span></div>
<div class="cal"><h2>2026年 12月<small>日付をタップすると詳細が出ます</small></h2><div class="dow"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div><div class="sun">日</div></div><div class="grid" id="grid"></div></div>
<div class="panel" id="panelSec"></div>
<footer>※ 叩き台デモです。ゲスト名・日程はすべて架空のサンプルデータです（金沢の酒蔵ツアーを想定）。</footer>
</div>
<div class="dockwrap bbar"><div class="dockin">
<button data-act="today"><span class="ic">📅</span>今日 12/3</button>
<button data-act="warn"><span class="ic">⚠️</span>警告の日</button>
<button data-act="detail"><span class="ic">📋</span>詳細</button>
<button data-act="top"><span class="ic">⬆️</span>先頭へ</button>
</div></div>

<script>

const RES={
 3:[{time:"10:00",guest:"Emma Wilson",n:"2名",ch:"viator",chName:"Viator",status:"新着"}],
 5:[{time:"10:00",guest:"Liam Chen",n:"4名",ch:"byfood",chName:"byFood",status:"確認済み"},
     {time:"14:00",guest:"佐藤 美咲",n:"2名",ch:"own",chName:"自社サイト",status:"前日連絡済み"}],
 6:[{time:"10:00",guest:"Sofia Garcia",n:"3名",ch:"airbnb",chName:"Airbnb",status:"確認済み"},
     {time:"10:30",guest:"Noah Brown",n:"2名",ch:"viator",chName:"Viator",status:"新着"}],
 8:[{time:"13:00",guest:"Ava Thompson",n:"5名",ch:"byfood",chName:"byFood",status:"新着"}],
 10:[{time:"14:00",guest:"Oliver Smith",n:"2名",ch:"own",chName:"自社サイト",status:"確認済み"}],
 12:[{time:"10:00",guest:"Mia Johnson",n:"6名",ch:"viator",chName:"Viator",status:"確認済み"}]
};
const OVERLAP={6:"10:00 Airbnb（3名）と 10:30 Viator（2名）が重なっています。ガイド1名では同時に対応できません。"};
const DOW=['日','月','火','水','木','金','土'];
function gridHtml(){
  let cells='<div class="cell empty"></div>';
  for(let d=1;d<=31;d++){
    const dow=(d+1)%7;
    const cls=['cell']; if(dow===0)cls.push('sun'); if(dow===6)cls.push('sat');
    if(d===3)cls.push('today'); if(OVERLAP[d])cls.push('overlap');
    const chips=(RES[d]||[]).map(r=>`<span class="chip c-${r.ch}">${r.time} ${r.guest.split(' ')[0]}</span>`).join('');
    cells+=`<div class="${cls.join(' ')}" data-d="${d}"><span class="d">${d}</span>${OVERLAP[d]?'<span class="warnmark">⚠️</span>':''}${chips}</div>`;
  }
  return cells;
}
function detailHtml(d){
  const dowName=DOW[(d+1)%7];
  const rows=RES[d];
  if(!rows) return `<h3>12/${d}（${dowName}）</h3><p class="none">この日の予約はありません。<br>販売枠は開いています。</p>`;
  return `<h3>12/${d}（${dowName}）の予約 ${rows.length}件</h3>`+
    rows.map(r=>`<div class="res"><span class="t">${r.time}</span><span class="badge c-${r.ch}">${r.chName}</span><br>${r.guest} / ${r.n}<br>状態：${r.status} / 金沢 酒蔵ツアー</div>`).join('')+
    (OVERLAP[d]?`<div class="warn">⚠️ 二重予約の警告<br>${OVERLAP[d]}</div>`:'');
}
function markSel(d){document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('sel',+c.dataset.d===d))}
function daySummary(d){
  const rows=RES[d];
  if(!rows) return {t:`12/${d}（${DOW[(d+1)%7]}）`, m:'予約なし ・ 販売枠は開いています', warn:false};
  return {t:`12/${d}（${DOW[(d+1)%7]}）の予約`, m:`${rows.length}件`+(OVERLAP[d]?' ・ ⚠ 重なりあり':''), warn:!!OVERLAP[d]};
}

let cur=6;
const grid=document.getElementById('grid'), panel=document.getElementById('panelSec');
grid.innerHTML=gridHtml();
function render(){ markSel(cur); panel.innerHTML=detailHtml(cur); }
grid.querySelectorAll('.cell[data-d]').forEach(c=>c.addEventListener('click',()=>{cur=+c.dataset.d;render();}));
document.querySelectorAll('.dockin button').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='today'){ cur=3; render(); panel.scrollIntoView({behavior:'smooth'}); }
  if(a==='warn'){ cur=6; render(); panel.scrollIntoView({behavior:'smooth'}); }
  if(a==='detail'){ panel.scrollIntoView({behavior:'smooth'}); }
  if(a==='top'){ window.scrollTo({top:0,behavior:'smooth'}); }
}));
render();

</script>
</body>
</html>
