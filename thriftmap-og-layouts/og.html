<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0d0d0d;font-family:'Archivo','Noto Sans JP',sans-serif;padding:56px 60px}
h1{color:#fff;font-size:64px;font-weight:900;line-height:1.05;letter-spacing:.01em}
.rule{width:96px;height:8px;background:#D9342B;margin:22px 0 30px}
.row{display:flex;gap:14px}
.row figure{flex:1}
.row img{width:100%;height:auto;display:block;border:2px solid #3a3a3a}
.row figcaption{color:#fff;font-size:19px;font-weight:900;margin-top:10px;text-align:center}
</style></head><body>
<h1>THRIFT MAP OGP<br>レイアウト5案</h1>
<div class="rule"></div>
<div class="row">
<figure><img src="v1.jpg"><figcaption>1</figcaption></figure>
<figure><img src="v2.jpg"><figcaption>2</figcaption></figure>
<figure><img src="v3.jpg"><figcaption>3</figcaption></figure>
<figure><img src="v4.jpg"><figcaption>4</figcaption></figure>
<figure><img src="v5.jpg"><figcaption>5</figcaption></figure>
</div>
</body></html>
