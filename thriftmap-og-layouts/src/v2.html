<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Archivo','Noto Sans JP',sans-serif;background:#F1EFEA}
.bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;height:252px;background:#FEFEF9;border-top:3px solid #121212;padding:34px 48px 30px;display:flex;flex-direction:column}
.row1{display:flex;align-items:center;gap:28px}
.logo{height:48px;width:auto;display:block}
.head{font-size:38px;font-weight:900;color:#121212;line-height:1}
.meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.dots{display:flex;gap:9px}
.dots i{width:12px;height:12px;border-radius:50%;background:#D8D3C6;display:block}
.dots i.on{background:#81660D}
.swipe{font-size:16px;font-weight:700;letter-spacing:.32em;color:#8A8578}
.pillrow{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:16px}
.chev{font-size:46px;font-weight:900;color:#121212;line-height:1;display:flex;align-items:center}
.pill{display:flex;align-items:center;justify-content:center;border-radius:999px;line-height:1;white-space:nowrap}
.pill span{display:block;transform:translateY(var(--n,0px))}
.pill.sel{width:520px;height:84px;background:#81660D;border:4px solid #121212;color:#fff;font-size:45px;font-weight:800}
.pill.side{width:170px;height:64px;background:#fff;border:3px solid #B9B4A6;color:#8A8578;font-size:30px;font-weight:700}
</style><style>.pill.sel span{transform:translateY(1px)}</style></head><body>
<div class="bg">
<img src="../../thrift-map/img/photos/chicagoshimo-1.jpg"><img src="../../thrift-map/img/photos/trefacshimo-1.jpg"><img src="../../thrift-map/img/photos/flamingo-3.jpg"><img src="../../thrift-map/img/photos/kinjishimo-1.jpg">
<img src="../../thrift-map/img/photos/secondshimo-1.jpg"><img src="../../thrift-map/img/photos/stickout-2.jpg"><img src="../../thrift-map/img/photos/chicagoshimo-3.jpg"><img src="../../thrift-map/img/photos/trefacshimo-3.jpg">
</div>
<div class="sheet">
<div class="row1">
<img class="logo" src="../../thrift-map/img/logo-1line-v3.png" alt="THRIFT MAP">
<div class="head">Where to thrift in</div>
<div class="meta">
<div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="swipe">SWIPE TO PICK AN AREA</div>
</div>
</div>
<div class="pillrow">
<div class="chev">‹</div>
<div class="pill side"><span>Ueno</span></div>
<div class="pill sel"><span>Shimokitazawa</span></div>
<div class="pill side"><span>Koenji</span></div>
<div class="chev">›</div>
</div>
</div>
</body></html>
