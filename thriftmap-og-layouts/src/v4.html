<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Archivo','Noto Sans JP',sans-serif;background:#F1EFEA}
.bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:860px;background:#FEFEF9;border:3px solid #121212;border-radius:28px;padding:48px 48px 42px;display:flex;flex-direction:column;align-items:center}
.logo{height:84px;width:auto;display:block}
.head{margin-top:30px;font-size:50px;font-weight:900;color:#121212;line-height:1}
.pill{margin-top:28px;width:660px;height:112px;background:#81660D;border:4px solid #121212;border-radius:999px;display:flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap;color:#fff;font-size:60px;font-weight:800}
.pill span{display:block;transform:translateY(var(--n,0px))}
.swipe{margin-top:26px;font-size:19px;font-weight:700;letter-spacing:.34em;color:#8A8578;text-indent:.34em}
</style><style>.pill span{transform:translateY(2px)}</style></head><body>
<div class="bg">
<img src="../../thrift-map/img/photos/chicagoshimo-1.jpg"><img src="../../thrift-map/img/photos/trefacshimo-1.jpg"><img src="../../thrift-map/img/photos/flamingo-3.jpg"><img src="../../thrift-map/img/photos/kinjishimo-1.jpg">
<img src="../../thrift-map/img/photos/secondshimo-1.jpg"><img src="../../thrift-map/img/photos/stickout-2.jpg"><img src="../../thrift-map/img/photos/chicagoshimo-3.jpg"><img src="../../thrift-map/img/photos/trefacshimo-3.jpg">
</div>
<div class="card">
<img class="logo" src="../../thrift-map/img/logo-1line-v3.png" alt="THRIFT MAP">
<div class="head">Where to thrift in</div>
<div class="pill"><span>Shimokitazawa</span></div>
<div class="swipe">SWIPE TO PICK AN AREA</div>
</div>
</body></html>
