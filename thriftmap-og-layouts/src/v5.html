<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Archivo','Noto Sans JP',sans-serif;background:#F1EFEA}
.panel{position:absolute;left:0;top:0;bottom:0;width:492px;background:#F1EFEA;border-right:3px solid #121212;padding:52px 48px;display:flex;flex-direction:column;align-items:flex-start}
.logo{height:46px;width:auto;display:block}
.head{margin-top:34px;font-size:47px;font-weight:900;color:#121212;line-height:1.04}
.pill{display:flex;align-items:center;justify-content:center;border-radius:999px;line-height:1;white-space:nowrap}
.pill span{display:block;transform:translateY(var(--n,0px))}
.pill.sel{margin-top:30px;width:396px;height:84px;background:#81660D;border:4px solid #121212;color:#fff;font-size:42px;font-weight:800}
.siderow{margin-top:16px;display:flex;gap:12px}
.pill.side{width:192px;height:60px;background:#fff;border:3px solid #B9B4A6;color:#8A8578;font-size:28px;font-weight:700}
.dots{margin-top:30px;display:flex;gap:10px}
.dots i{width:13px;height:13px;border-radius:50%;background:#D8D3C6;display:block}
.dots i.on{background:#81660D}
.swipe{margin-top:14px;font-size:17px;font-weight:700;letter-spacing:.32em;color:#8A8578}
.grid{position:absolute;right:0;top:0;bottom:0;width:708px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
</style><style>.pill.sel span{transform:translateY(2px)}</style></head><body>
<div class="panel">
<img class="logo" src="../../thrift-map/img/logo-1line-v3.png" alt="THRIFT MAP">
<div class="head">Where to<br>thrift in</div>
<div class="pill sel"><span>Shimokitazawa</span></div>
<div class="siderow">
<div class="pill side"><span>Ueno</span></div>
<div class="pill side"><span>Koenji</span></div>
</div>
<div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="swipe">SWIPE TO PICK AN AREA</div>
</div>
<div class="grid">
<img src="../../thrift-map/img/photos/chicagoshimo-1.jpg"><img src="../../thrift-map/img/photos/flamingo-3.jpg">
<img src="../../thrift-map/img/photos/trefacshimo-1.jpg"><img src="../../thrift-map/img/photos/stickout-2.jpg">
</div>
</body></html>
