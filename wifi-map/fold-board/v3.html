<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案3 大きめバー＋注記｜ワイスピ 任意項目トグル5案</title>
<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{background:#c9d4c9; color:#101410; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.6;}
:root{--ink:#101410; --grn:#16c95c; --neon:#34f27b; --deep:#0b7a38; --pale:#c9f7da; --mint:#8fe8b1; --line:#e2eae3;}
button{font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:7px 12px; font-size:13.5px; font-weight:700;}
button.on{background:var(--grn); border-color:var(--grn); color:#06130a;}
.panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 8px 30px rgba(16,20,16,.14); margin:8px;}
.panel h2{font-size:15px; font-weight:800;}
.panel .hint{font-size:11.5px; line-height:1.45; color:#5c6b5e; margin-top:4px;}
.f-row{margin:6px 0;}
.f-row label{display:block; font-size:12px; color:#5c6b5e; margin-bottom:2px;}
.f-row input{width:100%; font:inherit; font-size:15px; color:var(--ink); background:#f7faf7; border:1px solid var(--line); border-radius:9px; padding:7px 9px;}
.f-2col{display:flex; gap:8px;}
.f-2col .f-row{flex:1; min-width:0;}
.f-btns{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.shortcut{display:block; text-align:center; background:#101410; color:#fff; border-radius:10px; padding:8px; font-size:13.5px; font-weight:700; text-decoration:none; margin:2px 0 4px;}
#guess{font-size:13px; padding:5px 11px; border-radius:999px; margin-top:2px;}
.fold-current{width:100%; font:inherit; font-size:13px; font-weight:700; padding:8px; border:1.5px dashed var(--line); border-radius:10px; background:#fbfdfb; color:var(--ink); margin:8px 0 2px;}

.stage{width:390px; margin:0 auto;}
</style>
</head>
<body>
<div class="stage">

<div class="panel">
<h2>今いる場所のWi-Fiを追加</h2>
<a class="shortcut" href="#">📶 接続中のWi-Fiで自動入力（ショートカット）</a>
<p class="hint">SSIDとパスワードは手入力。追加分はこの端末に保存される（恒久化はカードの「コピー」を Muse に送る）。</p>

<div class="f-row">
<label>スポット名（必須）</label>
<input type="text" value="猿田彦珈琲 アトレ秋葉原1店">
</div>
<div class="f-row">
<button type="button" id="guess">🔍 近くの場所を推測</button>
</div>
<div class="f-row">
<label>SSID</label>
<input type="text" value="SARUTAHIKOCOFFEE">
</div>
<div class="f-2col">
<div class="f-row">
<label>緯度（必須）</label>
<input type="text" value="35.698364">
</div>
<div class="f-row">
<label>経度（必須）</label>
<input type="text" value="139.773152">
</div>
</div>
<div class="f-btns">
<button type="button">📍 現在地を入れる</button>
</div>

<button type="button" style="width:100%; background:#fff; border:2px solid #101410; border-radius:12px; padding:12px 14px; text-align:left; margin:10px 0 2px;">
<span style="display:flex; align-items:center; justify-content:space-between;">
<span style="font-size:15.5px; font-weight:800;">任意項目をひらく</span>
<span style="font-size:15px; font-weight:800;">▽</span>
</span>
<span style="display:block; margin-top:3px; font-size:12.5px; font-weight:700; color:#0b7a38;">⚡ 速度が測れます ・ 📷 写真も付けられます</span>
</button>

<div class="f-btns">
<button type="button" class="on">保存して地図に追加</button>
<button type="button">キャンセル</button>
</div>
</div>

</div>
</body>
</html>
