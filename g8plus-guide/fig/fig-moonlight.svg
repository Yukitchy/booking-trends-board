<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="960" height="470" rx="18" fill="#0d1226"/>

  <!-- settings panel mock -->
  <rect x="40" y="36" width="520" height="398" rx="16" fill="#131a36" stroke="#334155" stroke-width="2"/>
  <text x="70" y="82" font-size="22" font-weight="bold" fill="#ffffff">Moonlight 設定画面の模式図</text>

  <g font-size="18">
    <rect x="70" y="106" width="460" height="58" rx="10" fill="#1b2b52"/>
    <text x="92" y="142" fill="#e0f2fe">解像度</text>
    <text x="508" y="142" text-anchor="end" font-weight="bold" fill="#67e8f9">1920 × 1080</text>

    <rect x="70" y="176" width="460" height="58" rx="10" fill="#1b2b52"/>
    <text x="92" y="212" fill="#e0f2fe">フレームレート</text>
    <text x="508" y="212" text-anchor="end" font-weight="bold" fill="#67e8f9">60 FPS</text>

    <rect x="70" y="246" width="460" height="58" rx="10" fill="#1b2b52"/>
    <text x="92" y="282" fill="#e0f2fe">ビットレート</text>
    <text x="508" y="282" text-anchor="end" font-weight="bold" fill="#67e8f9">20 Mbps</text>

    <rect x="70" y="316" width="460" height="58" rx="10" fill="#1b2b52"/>
    <text x="92" y="352" fill="#e0f2fe">タッチ操作</text>
    <text x="508" y="352" text-anchor="end" font-weight="bold" fill="#67e8f9">トラックパッド</text>

    <rect x="70" y="386" width="460" height="34" rx="10" fill="#1b2b52"/>
    <text x="92" y="410" font-size="15" fill="#cbd5e1">3本指タップでキーボード表示</text>
  </g>

  <!-- notes -->
  <g>
    <rect x="592" y="36" width="328" height="188" rx="16" fill="#172554" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="616" y="76" font-size="20" font-weight="bold" fill="#67e8f9">最初はこの値で十分</text>
    <text x="616" y="112" font-size="16" fill="#e0f2fe">カクつく → ビットレートを下げる</text>
    <text x="616" y="142" font-size="16" fill="#e0f2fe">粗い → ビットレートを上げる</text>
    <text x="616" y="172" font-size="16" fill="#e0f2fe">文字が小さい → 解像度を下げる</text>
    <text x="616" y="202" font-size="16" fill="#e0f2fe">一度に変えるのは1項目だけ</text>
  </g>
  <g>
    <rect x="592" y="240" width="328" height="194" rx="16" fill="#131a36" stroke="#f472b6" stroke-width="2.5"/>
    <text x="616" y="280" font-size="20" font-weight="bold" fill="#f9a8d4">Mac操作の正路はタッチ</text>
    <text x="616" y="316" font-size="16" fill="#e0f2fe">画面なぞりでカーソル移動</text>
    <text x="616" y="346" font-size="16" fill="#e0f2fe">タップでクリック</text>
    <text x="616" y="376" font-size="16" fill="#e0f2fe">2本指ドラッグでスクロール</text>
    <text x="616" y="406" font-size="16" fill="#e0f2fe">ペン併用も公式対応</text>
  </g>
</svg>
