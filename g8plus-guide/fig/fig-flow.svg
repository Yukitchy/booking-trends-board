<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
    <marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" rx="18" fill="#0d1226"/>

  <!-- iPad + controller -->
  <g>
    <rect x="30" y="90" width="300" height="180" rx="16" fill="#131a36" stroke="#22d3ee" stroke-width="3"/>
    <rect x="52" y="112" width="256" height="136" rx="8" fill="#1b2b52"/>
    <text x="180" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#e0f2fe">Macの画面</text>
    <text x="180" y="200" text-anchor="middle" font-size="17" fill="#a5f3fc">Moonlightで表示</text>
    <rect x="14" y="78" width="26" height="204" rx="12" fill="#1f2a4d" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="320" y="78" width="26" height="204" rx="12" fill="#1f2a4d" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="27" cy="120" r="8" fill="#f472b6"/>
    <circle cx="333" cy="120" r="8" fill="#f472b6"/>
    <text x="180" y="312" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">iPad mini ＋ G8 Plus</text>
    <text x="180" y="340" text-anchor="middle" font-size="16" fill="#cbd5e1">手元側・映像の受け手と操作の送り手</text>
  </g>

  <!-- Wi-Fi -->
  <g>
    <path d="M420 62 q40 -34 80 0" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <path d="M436 80 q24 -18 48 0" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <circle cx="460" cy="94" r="6" fill="#facc15"/>
    <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#fde68a">Wi-Fi</text>
    <text x="460" y="200" text-anchor="middle" font-size="15" fill="#cbd5e1">外出先は Tailscale 経由</text>
  </g>

  <!-- Mac -->
  <g>
    <rect x="600" y="90" width="300" height="180" rx="16" fill="#131a36" stroke="#22d3ee" stroke-width="3"/>
    <rect x="622" y="112" width="256" height="116" rx="8" fill="#1b2b52"/>
    <text x="750" y="162" text-anchor="middle" font-size="26" font-weight="bold" fill="#e0f2fe">デスクトップ</text>
    <text x="750" y="194" text-anchor="middle" font-size="17" fill="#a5f3fc">Sunshineで配信</text>
    <rect x="700" y="238" width="100" height="12" rx="6" fill="#334155"/>
    <text x="750" y="312" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">Mac（m2）</text>
    <text x="750" y="340" text-anchor="middle" font-size="16" fill="#cbd5e1">母艦側・常時起動</text>
  </g>

  <!-- arrows -->
  <line x1="352" y1="140" x2="592" y2="140" stroke="#22d3ee" stroke-width="4" marker-end="url(#ar2)" marker-start="url(#ar)"/>
  <text x="472" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#67e8f9">映像 Mac → iPad</text>

  <line x1="592" y1="238" x2="352" y2="238" stroke="#f472b6" stroke-width="4" marker-end="url(#ar)"/>
  <text x="472" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#f9a8d4">タッチ操作 iPad → Mac ○</text>

  <line x1="592" y1="392" x2="352" y2="392" stroke="#f87171" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arx)"/>
  <text x="472" y="382" text-anchor="middle" font-size="17" font-weight="bold" fill="#fca5a5">パッド入力 iPad → Mac × Mac側に受け口なし</text>
</svg>
