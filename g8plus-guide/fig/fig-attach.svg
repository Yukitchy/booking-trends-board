<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="18" fill="#0d1226"/>

  <!-- step 1 -->
  <g>
    <circle cx="70" cy="60" r="26" fill="#f472b6"/>
    <text x="70" y="69" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <rect x="40" y="110" width="240" height="110" rx="14" fill="#131a36" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="70" y="132" width="26" height="66" rx="10" fill="#1f2a4d" stroke="#f472b6" stroke-width="2"/>
    <rect x="224" y="132" width="26" height="66" rx="10" fill="#1f2a4d" stroke="#f472b6" stroke-width="2"/>
    <path d="M100 165 h120" stroke="#facc15" stroke-width="4" stroke-dasharray="6 5" marker-end="url(#ar)"/>
    <path d="M220 165 h-120" stroke="#facc15" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="160" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">左右に引いて広げる</text>
    <text x="160" y="290" text-anchor="middle" font-size="15" fill="#cbd5e1">対応長 120〜215mm</text>
  </g>

  <line x1="296" y1="165" x2="344" y2="165" stroke="#22d3ee" stroke-width="4" marker-end="url(#ar)"/>

  <!-- step 2 -->
  <g>
    <circle cx="390" cy="60" r="26" fill="#f472b6"/>
    <text x="390" y="69" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <rect x="360" y="110" width="240" height="110" rx="14" fill="#131a36" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="386" y="126" width="188" height="78" rx="8" fill="#1b2b52"/>
    <text x="480" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#e0f2fe">iPad mini</text>
    <rect x="352" y="118" width="20" height="94" rx="9" fill="#1f2a4d" stroke="#f472b6" stroke-width="2"/>
    <rect x="588" y="118" width="20" height="94" rx="9" fill="#1f2a4d" stroke="#f472b6" stroke-width="2"/>
    <text x="480" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">iPad mini を挟む</text>
    <text x="480" y="290" text-anchor="middle" font-size="15" fill="#cbd5e1">長さ約195mmで範囲内</text>
  </g>

  <line x1="616" y1="165" x2="664" y2="165" stroke="#22d3ee" stroke-width="4" marker-end="url(#ar)"/>

  <!-- step 3 -->
  <g>
    <circle cx="710" cy="60" r="26" fill="#f472b6"/>
    <text x="710" y="69" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <rect x="680" y="110" width="240" height="110" rx="14" fill="#131a36" stroke="#facc15" stroke-width="2.5"/>
    <circle cx="800" cy="150" r="17" fill="#1f2a4d" stroke="#facc15" stroke-width="3"/>
    <circle cx="800" cy="150" r="6" fill="#facc15"/>
    <path d="M760 128 a52 52 0 0 1 80 0" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <text x="800" y="196" text-anchor="middle" font-size="16" fill="#fde68a">LED 点滅</text>
    <text x="800" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">広げると自動で電源オン</text>
    <text x="800" y="290" text-anchor="middle" font-size="15" fill="#cbd5e1">畳むと自動で電源オフ</text>
  </g>
</svg>
