<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="18" fill="#0d1226"/>

  <!-- body -->
  <path d="M120 130 h720 a40 40 0 0 1 40 40 v180 a90 90 0 0 1 -90 90 h-70 a60 60 0 0 1 -60 -60 v-40 H300 v40 a60 60 0 0 1 -60 60 h-70 a90 90 0 0 1 -90 -90 V170 a40 40 0 0 1 40 -40 z" fill="#131a36" stroke="#22d3ee" stroke-width="3"/>
  <rect x="330" y="150" width="300" height="180" rx="10" fill="#1b2b52"/>
  <text x="480" y="232" text-anchor="middle" font-size="24" font-weight="bold" fill="#e0f2fe">iPad mini</text>
  <text x="480" y="264" text-anchor="middle" font-size="16" fill="#a5f3fc">ここに挟む</text>

  <!-- left stick -->
  <circle cx="205" cy="205" r="34" fill="#1f2a4d" stroke="#f472b6" stroke-width="3"/>
  <circle cx="205" cy="205" r="16" fill="#f472b6"/>
  <text x="205" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#f9a8d4">左スティック</text>
  <text x="205" y="262" text-anchor="middle" font-size="14" fill="#cbd5e1">押し込み＝L3</text>

  <!-- dpad -->
  <g fill="#1f2a4d" stroke="#f472b6" stroke-width="2.5">
    <rect x="188" y="300" width="34" height="100" rx="8"/>
    <rect x="155" y="333" width="100" height="34" rx="8"/>
  </g>
  <text x="205" y="448" text-anchor="middle" font-size="19" font-weight="bold" fill="#f9a8d4">十字キー</text>

  <!-- ABXY -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="755" cy="168" r="21" fill="#1f2a4d" stroke="#22d3ee" stroke-width="3"/><text x="755" y="176" fill="#67e8f9">Y</text>
    <circle cx="712" cy="211" r="21" fill="#1f2a4d" stroke="#22d3ee" stroke-width="3"/><text x="712" y="219" fill="#67e8f9">X</text>
    <circle cx="798" cy="211" r="21" fill="#1f2a4d" stroke="#22d3ee" stroke-width="3"/><text x="798" y="219" fill="#67e8f9">B</text>
    <circle cx="755" cy="254" r="21" fill="#1f2a4d" stroke="#22d3ee" stroke-width="3"/><text x="755" y="262" fill="#67e8f9">A</text>
  </g>
  <text x="755" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#67e8f9">ABXYボタン</text>
  <text x="755" y="300" text-anchor="middle" font-size="14" fill="#cbd5e1">磁石式で入替可能</text>

  <!-- right stick -->
  <circle cx="755" cy="368" r="34" fill="#1f2a4d" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="755" cy="368" r="16" fill="#22d3ee"/>
  <text x="755" y="448" text-anchor="middle" font-size="19" font-weight="bold" fill="#67e8f9">右スティック</text>
  <text x="755" y="472" text-anchor="middle" font-size="14" fill="#cbd5e1">押し込み＝R3</text>

  <!-- center buttons -->
  <circle cx="392" cy="368" r="17" fill="#1f2a4d" stroke="#facc15" stroke-width="3"/>
  <text x="392" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#fde68a">Capture</text>
  <circle cx="480" cy="368" r="21" fill="#1f2a4d" stroke="#facc15" stroke-width="3"/>
  <circle cx="480" cy="368" r="7" fill="#facc15"/>
  <text x="480" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#fde68a">Home（サークル）</text>
  <text x="480" y="434" text-anchor="middle" font-size="13" fill="#cbd5e1">色でモード表示</text>
  <circle cx="568" cy="368" r="17" fill="#1f2a4d" stroke="#facc15" stroke-width="3"/>
  <text x="568" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#fde68a">M</text>
  <text x="568" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#fde68a">Mボタン</text>

  <!-- triggers -->
  <rect x="150" y="84" width="90" height="30" rx="12" fill="#1f2a4d" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="195" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#c4b5fd">L2</text>
  <rect x="256" y="84" width="70" height="30" rx="12" fill="#1f2a4d" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="291" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#c4b5fd">L1</text>
  <rect x="634" y="84" width="70" height="30" rx="12" fill="#1f2a4d" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="669" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#c4b5fd">R1</text>
  <rect x="720" y="84" width="90" height="30" rx="12" fill="#1f2a4d" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="765" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#c4b5fd">R2</text>
  <text x="480" y="540" text-anchor="middle" font-size="16" fill="#cbd5e1">スティックとトリガーは Hall Effect 式でドリフトに強い・背面に L4／R4 の追加ボタン・上部に USB-C 端子</text>
</svg>
