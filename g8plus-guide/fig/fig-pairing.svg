<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" rx="18" fill="#0d1226"/>

  <!-- step 1: combo -->
  <g>
    <circle cx="70" cy="56" r="26" fill="#38bdf8"/>
    <text x="70" y="65" text-anchor="middle" font-size="24" font-weight="bold" fill="#082f49">1</text>
    <rect x="36" y="104" width="250" height="150" rx="14" fill="#131a36" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="110" cy="160" r="24" fill="#1f2a4d" stroke="#facc15" stroke-width="3"/>
    <circle cx="110" cy="160" r="8" fill="#facc15"/>
    <text x="150" y="170" font-size="26" font-weight="bold" fill="#ffffff">＋</text>
    <circle cx="205" cy="160" r="24" fill="#1f2a4d" stroke="#38bdf8" stroke-width="3"/>
    <text x="205" y="169" text-anchor="middle" font-size="22" font-weight="bold" fill="#7dd3fc">B</text>
    <text x="161" y="222" text-anchor="middle" font-size="16" fill="#e0f2fe">電源オフの状態で長押し</text>
    <text x="161" y="292" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">サークル＋B 長押しで起動</text>
    <text x="161" y="318" text-anchor="middle" font-size="15" fill="#cbd5e1">DS4モードで電源オン</text>
  </g>

  <line x1="300" y1="180" x2="340" y2="180" stroke="#22d3ee" stroke-width="4" marker-end="url(#ar)"/>

  <!-- step 2: LED -->
  <g>
    <circle cx="386" cy="56" r="26" fill="#38bdf8"/>
    <text x="386" y="65" text-anchor="middle" font-size="24" font-weight="bold" fill="#082f49">2</text>
    <rect x="352" y="104" width="250" height="150" rx="14" fill="#131a36" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="477" cy="158" r="20" fill="#38bdf8"/>
    <path d="M430 120 a62 62 0 0 1 94 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M445 138 a44 44 0 0 1 64 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="477" y="222" text-anchor="middle" font-size="16" fill="#e0f2fe">Home LED が青く高速点滅</text>
    <text x="477" y="292" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">青の高速点滅を確認</text>
    <text x="477" y="318" text-anchor="middle" font-size="15" fill="#cbd5e1">ペアリング待ちの合図</text>
  </g>

  <line x1="616" y1="180" x2="656" y2="180" stroke="#22d3ee" stroke-width="4" marker-end="url(#ar)"/>

  <!-- step 3: iPad bluetooth list -->
  <g>
    <circle cx="702" cy="56" r="26" fill="#38bdf8"/>
    <text x="702" y="65" text-anchor="middle" font-size="24" font-weight="bold" fill="#082f49">3</text>
    <rect x="668" y="104" width="256" height="150" rx="14" fill="#131a36" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="692" y="136" font-size="15" fill="#94a3b8">設定 ＞ Bluetooth</text>
    <rect x="684" y="148" width="224" height="44" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="796" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">DUALSHOCK 4</text>
    <text x="796" y="216" text-anchor="middle" font-size="13.5" fill="#fca5a5">名前は GameSir と出ない</text>
    <text x="796" y="292" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">DUALSHOCK 4 をタップ</text>
    <text x="796" y="318" text-anchor="middle" font-size="15" fill="#cbd5e1">接続完了で LED が薄オレンジ点灯</text>
  </g>
</svg>
