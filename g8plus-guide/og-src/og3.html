<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#f4f6fb;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;position:relative;}
.top{background:#111827;color:#fff;padding:26px 72px;display:flex;justify-content:space-between;align-items:center;}
.top .model{font-size:24px;font-weight:900;letter-spacing:.12em;}
.top .no{font-size:20px;color:#9ca3af;font-weight:700;}
.pad{padding:52px 72px;}
h1{color:#111827;font-size:76px;font-weight:900;line-height:1.2;}
h1 .r{color:#dc2626;}
.under{width:220px;height:10px;background:#dc2626;margin:26px 0;}
p{color:#374151;font-size:29px;font-weight:700;line-height:1.6;}
.spec{position:absolute;bottom:44px;left:72px;right:72px;display:flex;gap:12px;}
.spec span{border:2px solid #111827;color:#111827;font-weight:800;font-size:20px;padding:8px 16px;border-radius:8px;background:#fff;}
</style></head><body>
<div class="top"><span class="model">GameSir G8 Plus</span><span class="no">SETUP MANUAL</span></div>
<div class="pad">
<h1>取説スタイルで読む<br><span class="r">セットアップ手順</span></h1>
<div class="under"></div>
<p>モード切替・ペアリング・推奨設定を図解で整理</p>
</div>
<div class="spec"><span>Bluetooth 5.3</span><span>対応長 120〜215mm</span><span>Hall Effect</span><span>iPad mini 対応</span></div>
</body></html>
