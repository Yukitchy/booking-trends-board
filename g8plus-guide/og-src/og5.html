<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#0d1226;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;position:relative;}
.pad{padding:60px 72px;position:relative;z-index:2;}

.modes{position:absolute;right:64px;bottom:52px;display:flex;gap:12px;z-index:2;}
.modes div{border-radius:14px;padding:12px 18px;font-weight:900;font-size:21px;color:#0b0f22;}
.ctrl{position:absolute;right:-70px;top:-70px;width:430px;height:430px;border-radius:50%;border:26px solid #1f2a4d;}

<div class="ctrl"></div><div class="ctrl2"></div>
<div class="pad">

<p>DS4モード接続から Moonlight 設定まで図解</p>
</div>
<div class="modes"><div style="background:#38bdf8">DS4</div><div style="background:#facc15">Android</div><div style="background:#f87171">Switch</div><div style="background:#2dd4bf">G-Touch</div></div>
</body></html>
