<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#070a18;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;position:relative;}
.bar{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#22d3ee,#f472b6);}
.pad{padding:64px 72px;}
.tag{display:inline-block;border:2px solid #22d3ee;color:#67e8f9;font-weight:800;letter-spacing:.18em;font-size:20px;padding:6px 18px;border-radius:999px;}
h1{color:#fff;font-size:88px;font-weight:900;line-height:1.15;margin-top:28px;}
h1 .g{background:linear-gradient(90deg,#22d3ee,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;}
p{color:#b8c2e0;font-size:30px;margin-top:22px;font-weight:700;}
.flow{position:absolute;right:72px;bottom:58px;display:flex;align-items:center;gap:16px;color:#e0f2fe;font-size:24px;font-weight:800;}
.flow .box{background:#131a36;border:2px solid #263157;border-radius:14px;padding:12px 20px;}
.flow .arw{color:#22d3ee;font-size:30px;}
</style></head><body>
<div class="bar"></div>
<div class="pad">
<span class="tag">TUTORIAL ＆ SETTINGS</span>
<h1><span class="g">G8 Plus</span> セットアップ<br>完全ガイド</h1>
<p>iPad mini × Moonlight × Mac を図解で</p>
</div>
<div class="flow"><span class="box">🎮 G8 Plus</span><span class="arw">→</span><span class="box">iPad mini</span><span class="arw">→</span><span class="box">Mac</span></div>
</body></html>
