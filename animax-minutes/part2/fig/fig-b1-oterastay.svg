<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Noto Sans CJK JP','Hiragino Sans',sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#1e293b">お寺ステイ事業の構造</text>
  <text x="30" y="70" font-size="14" fill="#64748b">眠っている寺の部屋を、海外ゲスト向けの宿坊体験に変える仕組み</text>

  <defs>
    <marker id="arw4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Temple -->
  <rect x="25" y="120" width="250" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="158" font-size="19" font-weight="bold" fill="#15803d" text-anchor="middle">お寺</text>
  <text x="150" y="186" font-size="13.5" fill="#334155" text-anchor="middle">使っていない部屋の提供</text>
  <text x="150" y="208" font-size="13.5" fill="#334155" text-anchor="middle">人手不足で宿坊を</text>
  <text x="150" y="228" font-size="13.5" fill="#334155" text-anchor="middle">続けられない寺が狙い目</text>

  <!-- Center -->
  <rect x="385" y="110" width="230" height="160" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="500" y="152" font-size="20" font-weight="bold" fill="#4338ca" text-anchor="middle">お寺ステイ</text>
  <text x="500" y="180" font-size="13.5" fill="#334155" text-anchor="middle">アッキーの事業</text>
  <text x="500" y="204" font-size="13.5" fill="#334155" text-anchor="middle">宿坊体験を海外向けに販売</text>
  <text x="500" y="226" font-size="13.5" fill="#334155" text-anchor="middle">自社拠点とサポート拠点</text>

  <!-- Guests -->
  <rect x="725" y="120" width="215" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="832" y="158" font-size="19" font-weight="bold" fill="#c2410c" text-anchor="middle">海外ゲスト</text>
  <text x="832" y="186" font-size="13.5" fill="#334155" text-anchor="middle">1泊5万〜10万円</text>
  <text x="832" y="208" font-size="13.5" fill="#334155" text-anchor="middle">完売することもある</text>
  <text x="832" y="228" font-size="13.5" fill="#334155" text-anchor="middle">予約基盤は Bókun 等</text>

  <!-- arrows -->
  <line x1="278" y1="168" x2="380" y2="168" stroke="#475569" stroke-width="2.5" marker-end="url(#arw4)"/>
  <text x="329" y="156" font-size="12.5" fill="#475569" text-anchor="middle">部屋</text>
  <line x1="380" y1="222" x2="278" y2="222" stroke="#475569" stroke-width="2.5" marker-end="url(#arw4)"/>
  <text x="329" y="246" font-size="12.5" fill="#475569" text-anchor="middle">使用料</text>

  <line x1="618" y1="168" x2="720" y2="168" stroke="#475569" stroke-width="2.5" marker-end="url(#arw4)"/>
  <text x="669" y="156" font-size="12.5" fill="#475569" text-anchor="middle">体験</text>
  <line x1="720" y1="222" x2="618" y2="222" stroke="#475569" stroke-width="2.5" marker-end="url(#arw4)"/>
  <text x="669" y="246" font-size="12.5" fill="#475569" text-anchor="middle">宿泊料</text>

  <text x="480" y="300" font-size="13.5" fill="#334155" text-anchor="middle">サポート拠点は手数料20〜30％。儲けはお寺の修繕費に充てる形</text>

  <!-- bottom strategy boxes -->
  <rect x="25" y="330" width="290" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="362" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">拠点戦略</text>
  <text x="170" y="390" font-size="13" fill="#334155" text-anchor="middle">人気は高山と身延寺</text>
  <text x="170" y="412" font-size="13" fill="#334155" text-anchor="middle">「第2の高野山」を狙い</text>
  <text x="170" y="434" font-size="13" fill="#334155" text-anchor="middle">先に拠点を押さえる</text>

  <rect x="335" y="330" width="290" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="362" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">人材</text>
  <text x="480" y="390" font-size="13" fill="#334155" text-anchor="middle">片手間でも可能</text>
  <text x="480" y="412" font-size="13" fill="#334155" text-anchor="middle">寺に通える距離が条件</text>
  <text x="480" y="434" font-size="13" fill="#334155" text-anchor="middle">案内役の雰囲気も大事</text>

  <rect x="645" y="330" width="290" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="790" y="362" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">開拓</text>
  <text x="790" y="390" font-size="13" fill="#334155" text-anchor="middle">紹介が中心</text>
  <text x="790" y="412" font-size="13" fill="#334155" text-anchor="middle">クラウドファンディング経由や</text>
  <text x="790" y="434" font-size="13" fill="#334155" text-anchor="middle">足で回る挨拶もある</text>
</svg>
