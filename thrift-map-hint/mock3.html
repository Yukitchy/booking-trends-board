<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;0,900;1,900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F1EFEA;font-family:'Archivo','Noto Sans JP',sans-serif;width:390px}
.stage{padding:66px 16px 20px}
h1{font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.01em;font-size:25.7px;color:#141414;position:relative}
.kw{background:#81660D;color:#fff;padding:0 .1em}
.band{display:inline-flex;align-items:center;gap:.18em;background:#141414;color:#fff;padding:.07em .2em .11em;margin-top:.14em}
.band em{font-style:italic}
.hint{position:absolute;right:0;top:-54px;background:#fff;color:#141414;border:2.5px solid #141414;border-radius:999px;box-shadow:3px 3px 0 #141414;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px 6px;max-width:150px;text-align:center;line-height:1.25}
.hint i{position:absolute;left:26px;bottom:-8px;width:11px;height:11px;background:#fff;border-right:2.5px solid #141414;border-bottom:2.5px solid #141414;transform:rotate(45deg)}
</style></head><body><div class="stage">
<h1>Where to <span class="kw">Thrift</span> in<br>
<span class="band"><em>Shimokitazawa</em><svg viewBox="0 0 10 6" width="14" height="9"><path d="M1 1l4 4 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
<span class="hint"><i></i>Tap to change area</span>
</h1>
</div></body></html>
