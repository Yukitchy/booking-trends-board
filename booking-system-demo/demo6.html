<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案6 カルテ型 | 予約管理デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"M PLUS Rounded 1c",sans-serif; color:#221d15; background:#f7f3ec; line-height:1.75; -webkit-text-size-adjust:100%; padding:26px 16px 34px; }
  .note { max-width:900px; margin:0 auto 14px; font-size:13px; font-weight:700; color:#5a5245; text-align:center; }
  .note b { color:#d9622b; }
  /* app frame (LP案2ヒーローのカルテモックと同形) */
  .app { background:#fff; border:2.5px solid #221d15; border-radius:20px; overflow:hidden; box-shadow:0 16px 36px rgba(34,29,21,.14); margin:0 auto; max-width:900px; text-align:left; }
  .app-bar { background:#221d15; color:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; font-weight:800; line-height:1.5; }
  .app-bar .dots { display:inline-flex; align-items:center; flex:none; }
  .app-bar .dots span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-left:5px; }
  .app-body { display:grid; grid-template-columns:250px 1fr; }
  .app-side { border-right:2px solid #efe9df; padding:14px 12px; background:#fbf9f5; }
  .app-side .cap { font-size:11px; font-weight:800; color:#a08e76; letter-spacing:.1em; margin:4px 6px 10px; }
  .guest { border-radius:12px; padding:9px 11px; margin-bottom:8px; border:2px solid transparent; cursor:pointer; background:transparent; width:100%; text-align:left; font-family:inherit; display:block; }
  .guest:last-child { margin-bottom:0; }
  .guest:hover { border-color:#e9e1d3; }
  .guest.on { background:#fff; border-color:#221d15; }
  .guest .nm { font-size:13.5px; font-weight:800; line-height:1.5; color:#221d15; }
  .guest .mt { font-size:11px; color:#8a7d68; line-height:1.5; }
  .guest .mt .warnflag { color:#c22e2e; font-weight:800; }
  .badge { display:inline-block; font-size:10px; font-weight:800; line-height:1.6; color:#fff; border-radius:6px; padding:1px 7px; margin-left:5px; vertical-align:middle; white-space:nowrap; }
  .b-viator { background:#00a699; } .b-own { background:#d9622b; } .b-byfood { background:#7c5cbf; } .b-airbnb { background:#ff5a5f; }
  .app-main { padding:18px 20px 22px; }
  .carte-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .carte-head .name { font-size:20px; font-weight:800; line-height:1.4; }
  .status { display:inline-flex; align-items:center; justify-content:center; background:#e7f6ec; color:#157347; font-weight:800; font-size:12px; line-height:1.5; border-radius:999px; padding:3px 12px; white-space:nowrap; }
  .status.new { background:#fdeee3; color:#d9622b; }
  .rows { margin-top:14px; border-top:2px dashed #e7dfd2; }
  .row { display:grid; grid-template-columns:92px 1fr; gap:10px; padding:9px 0; border-bottom:2px dashed #e7dfd2; font-size:13.5px; }
  .row .k { color:#a08e76; font-weight:800; font-size:12px; padding-top:2px; }
  .alert { margin-top:14px; background:#fff7e8; border:2px solid #e8a13a; border-radius:12px; padding:10px 14px; font-size:13px; font-weight:700; }
  .alert.ok { background:#eefaf1; border-color:#3cb371; }
  .next { margin-top:12px; background:#221d15; color:#fff; border-radius:12px; padding:12px 16px; font-size:13.5px; }
  .next b { color:#ffb27a; }
  footer { max-width:900px; margin:14px auto 0; font-size:12px; color:#a08e76; text-align:center; }
  @media (max-width:720px){
    body { padding:18px 10px 26px; }
    .app-body { grid-template-columns:1fr; }
    .app-side { border-right:none; border-bottom:2px solid #efe9df; }
    .guest-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .guest { margin-bottom:0; }
    .app-main { padding:16px 14px 18px; }
  }
  @media (max-width:420px){
    .guest-list { grid-template-columns:1fr; }
    .row { grid-template-columns:64px 1fr; font-size:13px; }
    .carte-head .name { font-size:18px; }
    .note { font-size:12px; }
  }
</style>
</head>
<body>
<p class="note">実物デモ 案6 ― <b>カルテ型</b>：左の一覧でゲストを選ぶと、右のカルテが切り替わります</p>

<div class="app">
  <div class="app-bar"><span>予約カルテ ― これからの予約</span><span class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></span></div>
  <div class="app-body">
    <div class="app-side">
      <div class="cap">これからのゲスト</div>
      <div class="guest-list" id="guestList"></div>
    </div>
    <div class="app-main" id="carte"></div>
  </div>
</div>
<footer>※ 叩き台デモです。ゲスト名・日程はすべて架空のサンプルデータです（金沢の酒蔵ツアーを想定）。</footer>

<script>
const GUESTS=[
 {name:"Emma Wilson 様", ch:"viator", chName:"Viator", status:"新着",
  meta:"12/3（木）10:00 ・ 2名",
  date:"12月3日（木）10:00〜12:30 ・ 酒蔵ツアー", people:"大人2名",
  contact:"事前フォーム回答済み ・ 金沢駅 鼓門前集合",
  memo:"日本酒は初めて。甘口が好き（事前フォームより）",
  overlap:null,
  next:"予約確定の連絡を送る（文面の下書きは用意済み）"},
 {name:"Liam Chen 様", ch:"byfood", chName:"byFood", status:"確認済み",
  meta:"12/5（土）10:00 ・ 4名",
  date:"12月5日（土）10:00〜12:30 ・ 酒蔵ツアー", people:"大人4名",
  contact:"事前フォーム回答済み ・ ベジタリアン1名",
  memo:"ベジタリアン対応は酒蔵へ伝達済み",
  overlap:null,
  next:"前日リマインドを送る（文面の下書きは用意済み）"},
 {name:"佐藤 美咲 様", ch:"own", chName:"自社サイト", status:"前日連絡済み",
  meta:"12/5（土）14:00 ・ 2名",
  date:"12月5日（土）14:00〜16:30 ・ 酒蔵ツアー", people:"大人2名",
  contact:"前日連絡済み ・ 日本語対応",
  memo:"ラベル作りを楽しみにしている",
  overlap:null,
  next:"当日の集合場所を最終確認する"},
 {name:"Sofia Garcia 様", ch:"airbnb", chName:"Airbnb", status:"確認済み",
  meta:"12/6（日）10:00 ・ 3名",
  date:"12月6日（日）10:00〜12:30 ・ 酒蔵ツアー", people:"大人3名",
  contact:"事前フォーム回答済み ・ アレルギーなし",
  memo:"記念日での参加",
  overlap:"10:30〜 Noah Brown 様（Viator・2名）の予約と時間が重なっています",
  next:"重なっている Noah Brown 様の予約と日程を調整する（連絡文の下書きは用意済み）"},
 {name:"Noah Brown 様", ch:"viator", chName:"Viator", status:"新着",
  meta:"12/6（日）10:30 ・ 2名",
  date:"12月6日（日）10:30〜13:00 ・ 酒蔵ツアー", people:"大人2名",
  contact:"事前フォーム未回答",
  memo:"Sofia Garcia 様の予約との重なりの解消が先",
  overlap:"10:00〜 Sofia Garcia 様（Airbnb・3名）の予約と時間が重なっています",
  next:"Sofia Garcia 様の予約との重なりを調整してから、確定連絡を送る"},
 {name:"Ava Thompson 様", ch:"byfood", chName:"byFood", status:"新着",
  meta:"12/8（火）13:00 ・ 5名",
  date:"12月8日（火）13:00〜15:30 ・ 酒蔵ツアー", people:"大人5名",
  contact:"事前フォーム未回答",
  memo:"団体。利き酒用グラスの追加が必要",
  overlap:null,
  next:"予約確定の連絡を送る（文面の下書きは用意済み）"},
 {name:"Oliver Smith 様", ch:"own", chName:"自社サイト", status:"確認済み",
  meta:"12/10（木）14:00 ・ 2名",
  date:"12月10日（木）14:00〜16:30 ・ 酒蔵ツアー", people:"大人2名",
  contact:"事前フォーム回答済み ・ アレルギーなし",
  memo:"リピーターからの紹介",
  overlap:null,
  next:"前日リマインドを送る（文面の下書きは用意済み）"},
 {name:"Mia Johnson 様", ch:"viator", chName:"Viator", status:"確認済み",
  meta:"12/12（土）10:00 ・ 6名",
  date:"12月12日（土）10:00〜12:30 ・ 酒蔵ツアー", people:"大人6名",
  contact:"事前フォーム回答済み",
  memo:"子ども1名を含む",
  overlap:null,
  next:"前日リマインドを送る（文面の下書きは用意済み）"}
];
const list=document.getElementById('guestList'), carte=document.getElementById('carte');
list.innerHTML=GUESTS.map((g,i)=>
  `<button type="button" class="guest" data-i="${i}"><div class="nm">${g.name}<span class="badge b-${g.ch}">${g.chName}</span></div><div class="mt">${g.meta}${g.overlap?' ・ <span class="warnflag">⚠ 重なりあり</span>':''}</div></button>`
).join('');
function show(i){
  const g=GUESTS[i];
  document.querySelectorAll('.guest').forEach((el,j)=>el.classList.toggle('on', j===i));
  const alertHtml = g.overlap
    ? `<div class="alert">カレンダー照合 ― 重なりあり：${g.overlap}</div>`
    : `<div class="alert ok">カレンダー照合OK ― この前後に重なる予約はありません</div>`;
  carte.innerHTML=
    `<div class="carte-head">
       <div><span class="name">${g.name}</span><span class="badge b-${g.ch}">${g.chName}</span></div>
       <span class="status${g.status==='新着'?' new':''}">${g.status}</span>
     </div>
     <div class="rows">
       <div class="row"><span class="k">日時</span><span>${g.date}</span></div>
       <div class="row"><span class="k">人数</span><span>${g.people}</span></div>
       <div class="row"><span class="k">連絡</span><span>${g.contact}</span></div>
       <div class="row"><span class="k">メモ</span><span>${g.memo}</span></div>
     </div>
     ${alertHtml}
     <div class="next"><b>次の一手：</b>${g.next}</div>`;
}
document.querySelectorAll('.guest').forEach(el=>el.addEventListener('click',()=>show(+el.dataset.i)));
show(3); // 初期表示は重なり警告が見える Sofia Garcia
</script>
</body>
</html>
