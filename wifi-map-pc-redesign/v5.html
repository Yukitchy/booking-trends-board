<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ワイスピ PC版デザイン案5 計測コンソール型</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif; color:#e7efe8; background:#06130a; overflow:hidden; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { height:60px; background:#040b06; border-bottom:1px solid #1d3320; display:flex; align-items:center; padding:0 20px; gap:22px; }
  header .logo-img { height:30px; display:block; }
  .hstats { display:flex; gap:18px; font-size:12px; color:#7d9a84; letter-spacing:.06em; white-space:nowrap; }
  .hstats b { color:#34f27b; font-size:15px; }
  header .spacer { flex:1; }
  .seg { display:flex; background:#0d2012; border:1px solid #1d3320; border-radius:999px; padding:3px; }
  .seg span { padding:6px 18px; border-radius:999px; font-size:13px; font-weight:700; color:#9db8a4; white-space:nowrap; }
  .seg span.on { background:#16c95c; color:#06130a; }
  .chip { display:flex; align-items:center; gap:7px; border:1.5px solid #2a4a30; color:#cfe6d4; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; white-space:nowrap; }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:#3a5a40; }
  .layout { display:flex; height:calc(100vh - 60px); }
  #map { flex:1; background:#0a0f0a; }
  aside { width:470px; flex:none; border-left:1px solid #1d3320; background:#08170c; overflow:hidden; }
  .a-head { padding:14px 18px 11px; border-bottom:1px solid #1d3320; display:flex; align-items:baseline; gap:12px; }
  .a-head h1 { font-size:15px; font-weight:800; letter-spacing:.05em; white-space:nowrap; }
  .a-head p { font-size:11.5px; color:#7d9a84; white-space:nowrap; }
  .row { padding:13px 18px 14px; border-bottom:1px solid #12240f; border-bottom-color:#14260f; border-bottom:1px solid #16281a; }
  .row.sel { background:#0c2413; box-shadow:inset 4px 0 0 #16c95c; }
  .row .top { display:flex; align-items:baseline; gap:10px; }
  .row h2 { font-size:14.5px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .pw { font-size:10.5px; font-weight:700; letter-spacing:.08em; padding:3px 9px; border-radius:4px; white-space:nowrap; flex:none; }
  .pw.yes { color:#34f27b; border:1px solid #16c95c; }
  .pw.unk { color:#5f7a66; border:1px solid #24402a; }
  .meta { margin-top:3px; font-size:11.5px; color:#7d9a84; }
  .meta .ssid { font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  .meter-row { margin-top:9px; display:flex; align-items:center; gap:14px; }
  .meter { display:flex; gap:2.5px; flex:1; }
  .meter i { flex:1; height:14px; background:#14301b; border-radius:1.5px; }
  .meter i.f { background:#16c95c; }
  .meter i.f.hot { background:#34f27b; }
  .nums { font-family:ui-monospace,Menlo,monospace; font-size:16px; font-weight:700; color:#fff; white-space:nowrap; }
  .nums small { font-size:10px; color:#7d9a84; }
  .nums .up { color:#9db8a4; font-size:13.5px; }
  .unm { margin-top:9px; display:flex; align-items:center; gap:14px; }
  .unm .meter i { background:#101f13; }
  .unm .lbl { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#5f7a66; letter-spacing:.1em; white-space:nowrap; }
  .leaflet-control-attribution { font-size:9px; background:rgba(6,19,10,.7) !important; color:#7d9a84 !important; }
  .leaflet-control-attribution a { color:#7d9a84 !important; }
</style>
</head>
<body>
<header>
  <img class="logo-img" src="img/logo-white.png" alt="ワイスピ">
  <div class="hstats mono"><span>SPOTS <b>10</b></span><span>MEASURED <b>2</b></span><span>MAX ↓ <b>199.0</b> Mbps</span></div>
  <div class="spacer"></div>
  <div class="seg"><span>近い順</span><span class="on">速い順</span></div>
  <div class="chip"><span class="dot"></span>電源あり</div>
</header>
<div class="layout">
  <div id="map"></div>
  <aside>
    <div class="a-head"><h1>MEASUREMENT LOG</h1><p>実測ログ ｜ 速い順</p></div>
    <div id="list"></div>
  </aside>
</div>
<script src="lib/leaflet.js"></script>
<script src="data.js"></script>
<script>
  const SEG = 26;
  const meter = (v, measured) => {
    const f = measured ? Math.round(v / MAXDOWN * SEG) : 0;
    return `<span class="meter">${Array.from({length:SEG}, (_,i) =>
      `<i class="${i < f ? (i >= SEG*0.8 ? "f hot" : "f") : ""}"></i>`).join("")}</span>`;
  };
  document.getElementById("list").innerHTML = SPOTS.map((s,i) => `
    <div class="row${i===0 ? " sel" : ""}">
      <div class="top"><h2>${s.name}</h2><span class="pw ${s.power ? "yes" : "unk"}">${s.power ? "POWER" : "POWER 未確認"}</span></div>
      <div class="meta">${s.area} ・ <span class="ssid">${ssidLabel(s)}</span>${s.measured_on ? ` ・ ${s.measured_on}` : ""}</div>
      ${s.down !== null
        ? `<div class="meter-row">${meter(s.down, true)}<span class="nums">↓${fmt(s.down)}<small> Mbps</small> <span class="up">↑${fmt(s.up)}</span></span></div>`
        : `<div class="unm">${meter(0, false)}<span class="lbl">未計測 NO DATA</span></div>`}
    </div>`).join("");
  initMap("map", { dark:true });
</script>
</body>
</html>
