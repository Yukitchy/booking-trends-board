<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0a0c0a; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif; color:#fff; overflow:hidden; }
  .pad { padding:52px 56px 0; }
  .kicker { font-size:19px; font-weight:700; letter-spacing:.14em; color:#16c95c; }
  h1 { margin-top:14px; font-size:58px; font-weight:800; white-space:nowrap; }
  .rule { margin-top:22px; width:132px; height:9px; background:#e60012; }
  .row { margin-top:40px; display:flex; gap:14px; padding:0 56px; }
  .row figure { flex:1; }
  .row img { width:100%; height:252px; object-fit:cover; object-position:top; display:block; border:1px solid #3c4a3e; border-radius:8px; }
  .row figcaption { margin-top:10px; font-size:16.5px; font-weight:800; text-align:center; white-space:nowrap; }
  .row figcaption b { color:#16c95c; }
</style>
</head>
<body>
  <div class="pad">
    <div class="kicker">実測Wi-Fiマップ ワイスピ</div>
    <h1>ワイスピ PC版リデザイン 5案</h1>
    <div class="rule"></div>
  </div>
  <div class="row">
    <figure><img src="img/shot1.png" style="object-position:left top"><figcaption><b>1</b> サイドバー型</figcaption></figure>
    <figure><img src="img/shot2.png" style="object-position:right top"><figcaption><b>2</b> ダッシュボード型</figcaption></figure>
    <figure><img src="img/shot3.png" style="object-position:left top"><figcaption><b>3</b> フローティング型</figcaption></figure>
    <figure><img src="img/shot4.png" style="object-position:center top"><figcaption><b>4</b> エディトリアル型</figcaption></figure>
    <figure><img src="img/shot5.png" style="object-position:right top"><figcaption><b>5</b> 計測コンソール型</figcaption></figure>
  </div>
</body>
</html>
