<style>
*{margin:0;padding:0;box-sizing:border-box}
.phone{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN",sans-serif;background:#EDE6D6;color:#26241F;width:100%;min-height:700px;position:relative;overflow:hidden;padding-bottom:104px}
.appbar{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid #EFEAE0}
.logo{font-size:27px;font-weight:900;letter-spacing:-1.2px;display:flex;align-items:flex-end;gap:7px}
.mascots{display:flex;align-items:flex-end;gap:2.5px;padding-bottom:3px}
.mascots i{display:block;border-radius:50% 50% 46% 46%}
.mascots .m1{width:17px;height:15px;background:#F2E3C6;border:1.4px solid #D9C9A4}
.mascots .m2{width:13px;height:12px;background:#F6C445}
.mascots .m3{width:13px;height:12px;background:#F08A24}
.mascots .m4{width:13px;height:12px;background:#E03A2B}
.appbar-icons{display:flex;gap:16px;color:#4A463D}
.appbar-icons svg{width:23px;height:23px}
.titlebar{background:#fff;display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid #EFEAE0;position:relative}
.flag{position:relative;width:20px;height:24px;flex:none}
.flag:before{content:"";position:absolute;left:3px;top:3px;width:2px;height:19px;border-radius:2px;background:#C9B892}
.flag:after{content:"";position:absolute;left:5px;top:3px;border-left:11px solid #E03A2B;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.tb-title{font-size:16.5px;font-weight:700;flex:none}
.tb-sub{font-size:12px;color:#8A8378;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chev{width:13px;height:13px;vertical-align:-2px}
.card{background:#fff;border-radius:18px;margin:14px 12px 0;box-shadow:0 1px 3px rgba(60,50,30,.07);padding:6px 16px}
.grow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #F0EBE0}
.grow:last-child{border-bottom:none}
.tile{width:60px;height:60px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.tile.osh{background:#3D3D3B;color:#fff;font-weight:800;font-size:16.5px;letter-spacing:.4px}
.tile.lap{background:#2F2F2E}
.tile.lap svg{width:36px;height:36px}
.tile.wa{background:#A9A49A}
.tile.wa svg{width:34px;height:34px}
.gmeta{min-width:0;flex:1}
.gname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{font-size:12.8px;color:#8A8378;margin-top:3px}
.chevr{width:19px;height:19px;color:#B9B2A2;flex:none}
.tabbar{position:absolute;left:10px;right:10px;bottom:12px;background:#fff;border-radius:34px;box-shadow:0 6px 22px rgba(60,50,30,.16);display:flex;padding:7px 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2.5px;font-size:9.8px;color:#6F6A5E;padding:5px 0 4px;border-radius:26px}
.tab svg{width:21px;height:21px}
.tab.on{background:#26241F;color:#fff}
/* --- variant buttons --- */
.btn-v1{margin-left:auto;flex:none;font-size:12px;color:#6F6A5E;text-decoration:none;display:flex;align-items:center;gap:1px;padding:4px 0 4px 8px}
.btn-v2-wrap{display:flex;justify-content:center;padding:12px 0 0}
.btn-v2{font-size:12px;color:#6F6A5E;background:#E3DCC8;text-decoration:none;padding:6px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:2px}
.btn-v3-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.btn-v3-h{font-size:13px;font-weight:700;color:#4A463D}
.btn-v3{font-size:12px;color:#9A937F;text-decoration:none;display:inline-flex;align-items:center;gap:1px}
.btn-v4-wrap{display:flex;justify-content:flex-end;padding:9px 18px 0}
.btn-v4{font-size:12px;color:#6F6A5E;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.btn-v4 b{font-weight:700;color:#4A463D}
.btn-v5{position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;background:#DED5BF;color:#5C574B;font-size:11px;text-decoration:none;padding:4px 13px 6px;border-radius:0 0 11px 11px;box-shadow:0 3px 5px rgba(60,50,30,.13);display:inline-flex;align-items:center;gap:1px;z-index:3;white-space:nowrap}

body{background:#DDD5C0}
.phone{width:390px;margin:0 auto}
</style></head><body><div class="phone">
